{% extends 'base.html' %}
{% block title %}Login - ShopHub{% endblock %}

{% block content %}
<div class="container" style="max-width: 400px; margin-top: 3rem;">
    <div class="card">
        <div class="card-header">
            <h2 class="text-center" style="margin: 0;">Welcome Back</h2>
            <p class="text-center text-muted" style="margin-top: 0.5rem; margin-bottom: 0;">Sign in to your account</p>
        </div>
        
        <div class="card-body">
            <form method="POST" style="padding: 2rem 0;">
                {% csrf_token %}
                
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="Enter your email" autofocus>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter your password">
                </div>
                
                <button type="submit" class="btn btn-primary w-full" style="margin-top: 1.5rem; margin-bottom: 1rem;">
                    Sign In
                </button>
                
                <div style="text-align: center;">
                    <p class="text-muted">Don't have an account? 
                        <a href="{% url 'register' %}" style="color: var(--primary-color); font-weight: 600;">Create one now</a>
                    </p>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Additional info -->
    <div style="margin-top: 2rem; text-align: center;">
        <p style="color: var(--text-secondary);">Demo credentials available for testing</p>
    </div>
</div>
{% endblock %}

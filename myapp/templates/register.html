{% extends 'base.html' %}
{% block title %}Register - ShopHub{% endblock %}

{% block content %}
<div class="container" style="max-width: 450px; margin-top: 2rem; margin-bottom: 3rem;">
    <div class="card">
        <div class="card-header">
            <h2 class="text-center" style="margin: 0;">Create Account</h2>
            <p class="text-center text-muted" style="margin-top: 0.5rem; margin-bottom: 0;">Join ShopHub and start shopping today</p>
        </div>
        
        <div class="card-body">
            <form method="POST" style="padding: 2rem 0;">
                {% csrf_token %}
                
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required placeholder="Enter your full name">
                </div>
                
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="Enter your email">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Create a strong password" minlength="6">
                </div>
                
                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" required placeholder="Confirm your password" minlength="6">
                </div>
                
                <button type="submit" class="btn btn-primary w-full" style="margin-top: 1.5rem; margin-bottom: 1rem;">
                    Create Account
                </button>
                
                <div style="text-align: center;">
                    <p class="text-muted">Already have an account? 
                        <a href="{% url 'login' %}" style="color: var(--primary-color); font-weight: 600;">Sign in here</a>
                    </p>
                </div>
            </form>
        </div>
    </div>
    
    <div style="margin-top: 2rem; padding: 1.5rem; background: var(--light-bg); border-radius: 0.75rem; text-align: center;">
        <p style="font-size: 0.875rem; color: var(--text-secondary);">
            🔒 Your data is encrypted and secure | We never share your information
        </p>
    </div>
</div>
{% endblock %}

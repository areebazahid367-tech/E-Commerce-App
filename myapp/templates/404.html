{% extends 'base.html' %}
{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="container" style="text-align: center; padding: 4rem 2rem; min-height: 60vh; display: flex; flex-direction: column; justify-content: center;">
    <div style="font-size: 8rem; font-weight: 800; color: var(--primary-color); line-height: 1;">404</div>
    <h1 style="margin-top: 1rem; margin-bottom: 1rem;">Page Not Found</h1>
    <p style="font-size: 1.125rem; color: var(--text-secondary); margin-bottom: 2rem; max-width: 500px; margin-left: auto; margin-right: auto;">
        Oops! The page you're looking for doesn't exist. It might have been moved or deleted.
    </p>
    <div style="display: flex; gap: 1rem; justify-content: center;">
        <a href="{% url 'home' %}" class="btn btn-primary btn-lg">Go Home</a>
        <a href="{% url 'products' %}" class="btn btn-outline btn-lg">Browse Products</a>
    </div>
</div>
{% endblock %}

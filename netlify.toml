[build]
  command = "python export_static.py"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.11"

# Pretty URLs and clean routing for all pages
[[redirects]]
  from = "/products"
  to = "/products/index.html"
  status = 200

[[redirects]]
  from = "/cart"
  to = "/cart/index.html"
  status = 200

